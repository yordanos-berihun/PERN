services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  lmsbackend:
    image: lmsbackend
    build:
      context: lms-backend
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    depends_on:
      - postgres
    ports:
      - 5000:5000
      - 9229:9229
    command: ["sh", "-c", "npx prisma migrate deploy && if [ \"$SEED_ON_STARTUP\" = \"true\" ]; then node prisma/seed.js; fi && node --inspect=0.0.0.0:9229 server.js"]

volumes:
  postgres_data:
