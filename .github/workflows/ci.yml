name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/lms_test?schema=public
      JWT_SECRET: test_jwt_secret

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lms_test
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: lms-backend
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          python3 - <<'PY'
          import socket, time
          for _ in range(30):
              try:
                  s = socket.create_connection(("localhost", 5432), 1)
                  s.close()
                  print("Postgres is ready")
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit("Postgres did not start in time")
          PY

      - name: Apply database migrations
        working-directory: lms-backend
        run: npx prisma migrate deploy

      - name: Run backend tests
        working-directory: lms-backend
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: lms-frontend
        run: npm ci

      - name: Build frontend
        working-directory: lms-frontend
        run: npm run build
