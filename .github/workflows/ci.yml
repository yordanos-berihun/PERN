name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install backend dependencies
        working-directory: lms-backend
        run: npm ci

      - name: Run backend tests
        working-directory: lms-backend
        run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    needs: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        working-directory: lms-frontend
        run: npm ci

      - name: Build frontend
        working-directory: lms-frontend
        run: npm run build
