services:
  lmsbackend:
    image: lmsbackend
    build:
      context: lms-backend
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    ports:
      - 3000:3000

  lmsfrontend:
    image: lmsfrontend
    build:
      context: lms-frontend
      dockerfile: ./Dockerfile
      args:
        # Nginx proxies /api/ → backend, so the browser uses a relative URL
        VITE_API_URL: /api
    ports:
      - 5173:80
    depends_on:
      - lmsbackend
