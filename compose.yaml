services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_DB: ${POSTGRES_DB:-lms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

  lmsbackend:
    build:
      context: lms-backend
      dockerfile: ./Dockerfile
    image: lmsbackend
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
    depends_on:
      - postgres
    ports:
      - 3000:3000

  lmsfrontend:
    build:
      context: lms-frontend
      dockerfile: ./Dockerfile
      args:
        VITE_API_URL: /api
    image: lmsfrontend
    depends_on:
      - lmsbackend
    ports:
      - 5173:80

volumes:
  postgres_data:
